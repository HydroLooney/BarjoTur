# nginx du client v3 (SPA) : sert les fichiers statiques, fallback index.html pour le routage côté client.
# /api et /tiles ne sont PAS gérés ici : le proxy amont (NPM) route ces préfixes vers le BFF et Martin.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Actifs hachés (Vite) : cache long. index.html : jamais mis en cache (bascule immédiate au déploiement).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Fallback SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
