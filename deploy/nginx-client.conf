# nginx du client v3 (SPA) — STACK AUTO-PORTANTE (M465) : une seule entrée = le conteneur client.
# Fan-out interne dans le réseau compose : /api → bff, /tiles → Martin, /media → service média, / → statique SPA.
# NPM n'a plus qu'UN upstream (host → client:80) ; le flip public = repoint voyage.barjot.net → client v3.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # DNS embarqué Docker (résolution runtime des noms de service).
  resolver 127.0.0.11 valid=30s;
  client_max_body_size 2m;

  # API → BFF (préserve le préfixe /api ; le BFF route /api/*).
  location /api/ {
    proxy_pass http://bff:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Tuiles MVT → Martin (strip /tiles/ → /<source>/{z}/{x}/{y}).
  location /tiles/ {
    proxy_pass http://martin:8003/;
    proxy_set_header Host $host;
  }

  # Médias photos → service média statique (strip /media/ → /poi/…/photos/x.jpg).
  location /media/ {
    proxy_pass http://media:80/;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public";
  }

  # Actifs Vite hachés : cache long. index.html : jamais en cache (bascule immédiate).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html { add_header Cache-Control "no-store"; }

  # Fallback SPA (routage côté client).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
