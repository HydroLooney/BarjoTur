# Configuration Martin — tuiles MVT pour BarjoTur (C07).
# Source unique : DB2 (norvege_v2). Une source par couche, clustering en SQL (à câbler dans les vues DB2).
# Principes : une source par question (doctrine A05 "un viewer, une question") ; diffusion via diffusion.v_web_*
# et api.* ; jamais de données brutes exposées directement (POI brut, ways_van, etc.).
#
# Lancement en dev : martin --config tiles/config.toml
# DB2 réseau Docker (prod Bomp4rd) : la connexion passe par DATABASE_URL (env, secrets.env, jamais en dur).

[postgres]
# DSN DB2. En prod : injecté par l'orchestrateur Docker (MARTIN_DB_URL ou alias DATABASE_URL).
# En dev local : variable d'environnement MARTIN_DB_URL (ou tunnel SSH sur Bomp4rd).
connection_string = "${MARTIN_DB_URL}"

# Paramètres de pool : DB2 sert un cercle familial, les connexions Martin sont légères.
pool_size = 4

# Toutes les sources dans ce bloc sont issues de DB2 (norvege_v2).
# Les vues de diffusion (diffusion.v_web_*) et les vues api.* sont les seuls points de contact.
# Les tables physiques (poi.poi, mcda2.ways_van, etc.) ne sont jamais exposées directement.

# ---------------------------------------------------------------------------
# Couche POI (tous les POI avec cluster en SQL, zoom 5-14)
# diffusion.v_web_poi reprend les colonnes utiles au front + un champ cluster_id (calculé côté vue)
# ---------------------------------------------------------------------------
[[postgres.tables]]
schema = "diffusion"
table = "v_web_poi"
srid = 4326
geometry_column = "geom"
geometry_type = "Point"
clip_geom = true
buffer = 4
extent = 4096
minzoom = 5
maxzoom = 14
id_column = "poi_id"
properties = ["poi_id", "nom", "categorie", "sous_categorie", "tier_defaut", "votable", "cluster_count"]

# ---------------------------------------------------------------------------
# Couche bases (points de nuit, zoom 3-12)
# diffusion.v_web_bases : base_id, nom, tier moyen, nuits_max_faisable, lon, lat
# ---------------------------------------------------------------------------
[[postgres.tables]]
schema = "diffusion"
table = "v_web_bases"
srid = 4326
geometry_column = "geom"
geometry_type = "Point"
clip_geom = true
buffer = 4
extent = 4096
minzoom = 3
maxzoom = 12
id_column = "base_id"
properties = ["base_id", "nom", "nuits_max_faisable", "tier_moyen"]

# ---------------------------------------------------------------------------
# Couche circuits randonnée (lignes, zoom 7-14)
# diffusion.v_web_circuits : circuit_id, nom, distance_km, denivele_pos, tier_defaut, votable
# ---------------------------------------------------------------------------
[[postgres.tables]]
schema = "diffusion"
table = "v_web_circuits"
srid = 4326
geometry_column = "geom"
geometry_type = "LineString"
clip_geom = true
buffer = 4
extent = 4096
minzoom = 7
maxzoom = 14
id_column = "circuit_id"
properties = ["circuit_id", "nom", "distance_km", "denivele_pos", "tier_defaut", "votable"]

# ---------------------------------------------------------------------------
# Couche routes base-à-base (lignes, zoom 4-12)
# diffusion.v_web_base_routes : paires base src/tgt, geometry assemblée, temps_reel_s
# ---------------------------------------------------------------------------
[[postgres.tables]]
schema = "diffusion"
table = "v_web_base_routes"
srid = 4326
geometry_column = "geom"
geometry_type = "LineString"
clip_geom = true
buffer = 8
extent = 4096
minzoom = 4
maxzoom = 12
id_column = "route_id"
properties = ["route_id", "src_base", "tgt_base", "temps_reel_s", "km"]

# ---------------------------------------------------------------------------
# Couche itinéraire figé / carte animée (ligne continue, zoom 3-14)
# diffusion.v_web_fige : fige_id, label, km, nuits, est_archetype, geom (MultiLineString continue)
# La source de vérité est fige.geom (continue) ; jamais reconstruite leg par leg côté tuile.
# ---------------------------------------------------------------------------
[[postgres.tables]]
schema = "diffusion"
table = "v_web_fige"
srid = 4326
geometry_column = "geom"
geometry_type = "MultiLineString"
clip_geom = false
buffer = 8
extent = 4096
minzoom = 3
maxzoom = 14
id_column = "fige_id"
properties = ["fige_id", "label", "km", "nuits", "est_archetype", "est_consensus", "archetype_key"]

# ---------------------------------------------------------------------------
# Couche découpage ACE / ALE / ABR (polygones de fond, zoom 3-10)
# diffusion.v_web_decoupage : type (ace/ale/abr), id, label, geometry
# ---------------------------------------------------------------------------
[[postgres.tables]]
schema = "diffusion"
table = "v_web_decoupage"
srid = 4326
geometry_column = "geom"
geometry_type = "MultiPolygon"
clip_geom = true
buffer = 4
extent = 4096
minzoom = 3
maxzoom = 10
id_column = "decoupage_id"
properties = ["decoupage_id", "type_decoupage", "label", "code"]

# ---------------------------------------------------------------------------
# Service HTTP Martin
# ---------------------------------------------------------------------------
[srv]
# Port Martin en dev (8003 = port de recette local, cf tunnel SSH Bomp4rd).
# En prod Docker, Martin écoute sur le port du service dans le réseau web.
listen_addresses = "0.0.0.0:8003"
keep_alive = 75

# Cache tuiles en mémoire : adapté à la taille du cercle familial (pas une charge publique).
[cache]
type = "memory"
size = 200

# ---------------------------------------------------------------------------
# Notes d'intégration (à lire par le Maître avant déploiement)
# ---------------------------------------------------------------------------
# 1. Les vues diffusion.v_web_* n'existent pas encore dans DB2 ; elles sont à créer par A (C04)
#    ou par le Maître en coordination avec A. Ce fichier de config est PRÊT mais inactif tant que
#    les vues ne sont pas déployées.
# 2. Le champ cluster_count dans v_web_poi est calculé par SQL (GROUP BY ST_SnapToGrid) côté vue ;
#    Martin sert les tuiles avec ce champ pré-agrégé (clustering SQL, B06).
# 3. MARTIN_DB_URL doit pointer sur DB2 (norvege_v2@norvege-db:5432). En dev local :
#    export MARTIN_DB_URL="postgresql://norvege:<mot_de_passe>@localhost:15432/norvege_v2"
#    (tunnel SSH : ssh -L 15432:localhost:5432 bomp4rd)
# 4. Pour régénérer les tuiles après un recalcul (C04), relancer Martin suffit (pas de cache fichier).
